name: Downgrade build

# Pi installs git sources with `npm install --omit=dev`, which cannot build, so the downgrade branch
# carries its own dist/ as one build commit on top of the pin commit. A rerun on a branch whose tip
# is already that commit amends it instead of stacking another.
on:
  push:
    branches: [downgrade]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  BUILD_SUBJECT: "chore(dist): build the downgrade branch"

jobs:
  build:
    name: Build and commit dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: mise run check

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --force dist
          if git diff --cached --quiet; then
            echo "dist/ is already current"
            exit 0
          fi
          if [ "$(git log -1 --format=%s)" = "${BUILD_SUBJECT}" ]; then
            git commit --quiet --amend --no-edit
          else
            git commit --quiet --message "${BUILD_SUBJECT}"
          fi
          git push --force-with-lease="downgrade:${GITHUB_SHA}" origin HEAD:downgrade
