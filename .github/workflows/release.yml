name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag, package.json, and the changelog agree
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${package_version}"
            exit 1
          fi
          scripts/check-changelog.sh

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish npm package
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          # What a tag build publishes must not come from a cache another run could have written.
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --tag latest
