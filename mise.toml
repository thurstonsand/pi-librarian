min_version = "2026.7.4"

[settings]
experimental = true

[hooks]
enter = "mise bootstrap --yes --quiet"

[tools]
hk = "2.10.0"
node = "26"

[env]
HK_MISE = "1"
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.bootstrap]
description = "Install project dependencies and git hooks"
run = [
    "npm ci --quiet --no-fund --no-audit",
    # pi must always resolve to the global install, never this repo's copy
    "rm -f node_modules/.bin/pi",
    "hk install --mise --quiet",
]
sources = ["mise.toml", "hk.pkl", "package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
quiet = true

[tasks.lint]
description = "Lint"
depends = ["lint:*"]

[tasks."lint:biome"]
description = "Lint TypeScript, JSON, and Markdown"
run = "biome check ."

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"
tools.actionlint = "1.7.12"

# Renovate runs on the Node its engines field names (^24.11), not the project's. `tools.node` is the
# Node that builds re2 and the PATH prefix the Node that runs it, since Renovate's bin shim ends in
# `exec node`: a task's PATH can start at /opt/homebrew/bin on a Homebrew machine, and
# `{{ tools.node.path }}` names the project's Node. A mismatch fails re2's ABI check and downgrades
# regex validation to JavaScript RegExp with only a warning.
[tasks."lint:renovate"]
description = "Validate Renovate configuration"
run = "PATH=\"$(mise where node@24)/bin:$PATH\" renovate-config-validator renovate.json"
tools.node = "24"
tools."npm:renovate" = { version = "44.198.2", allow_builds = [
  "re2",
], trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }

[tasks.format]
description = "Format"
run = "biome format --write ."

[tasks.typecheck]
description = "Type-check TypeScript"
run = "tsc --noEmit"

[tasks.test]
description = "Run tests"
run = "vitest run"

[tasks.check]
description = "Run full verification"
depends = ["lint", "typecheck", "test"]

[tasks.renovate]
description = "Run Renovate"
run = "PATH=\"$(mise where node@24)/bin:$PATH\" renovate"
tools.node = "24"
tools."npm:renovate" = { version = "44.198.2", allow_builds = [
  "re2",
], trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }
