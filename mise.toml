min_version = "2026.10.4"

[settings]
experimental = true

[hooks]
enter = "mise bootstrap --yes --quiet"

[tools]
hk = "2.10.0"
node = "26"
# hk's check and fix hooks run jactionlint, which runs shellcheck over every `run:` script. Renovate
# does not know mise's `jactionlint` shorthand, so the backend is spelled out.
"aqua:jdx/jactionlint" = "2.4.0"
shellcheck = "0.11.0"

[env]
HK_MISE = "1"
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.bootstrap]
description = "Install project dependencies and git hooks"
run = [
    "npm ci --quiet --no-fund --no-audit",
    # pi must always resolve to the global install, never this repo's copy
    "rm -f node_modules/.bin/pi",
    "hk install --mise --quiet",
]
sources = ["mise.toml", "hk.pkl", "package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
quiet = true

[tasks.lint]
description = "Lint"
depends = ["lint:*"]

[tasks."lint:biome"]
description = "Lint TypeScript, JSON, and Markdown"
run = "biome check ."

[tasks."lint:changelog"]
description = "Check that CHANGELOG.md's headings parse, descend, and end at package.json's version"
run = "scripts/check-changelog.sh"

# `npm ci` installs the lockfile without re-resolving it, so CI stays green on a lockfile that
# `npm install`, which Renovate runs, rejects with ERESOLVE. It must run on mise's Node: another
# npm version rewrites the lockfile and fails the diff.
[tasks."lint:lockfile"]
description = "Check that package-lock.json still resolves from package.json, unchanged"
run = [
    "npm install --package-lock-only --ignore-scripts --quiet --no-fund --no-audit",
    "git diff --exit-code package-lock.json",
]

[tasks."lint:plugin"]
description = "Check that the Claude plugin's version, which pins the CLI it runs, matches package.json's"
run = 'test "$(node -p "require(\"./plugin/.claude-plugin/plugin.json\").version")" = "$(node -p "require(\"./package.json\").version")" || { echo "plugin/.claude-plugin/plugin.json version differs from package.json" >&2; exit 1; }'

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "hk check --all --step jactionlint"

# Renovate supports only Node 24 (its engines say ^24.11), while the repo develops on 26. Its tasks
# run under MISE_ENV=renovate, whose mise.renovate.toml overlays Node 24 and adds Renovate, so mise
# both installs and runs it on 24: re2, Renovate's native regex engine, is built for the Node that
# installs it and refuses to load in another, leaving validation on JavaScript RegExp with only a
# warning. `mise x` also puts that Node ahead of a Homebrew one already on PATH.
[tasks."lint:renovate"]
description = "Validate Renovate configuration"
run = "MISE_ENV=renovate mise x -- renovate-config-validator renovate.json"

[tasks.format]
description = "Format"
run = "biome format --write ."

[tasks.typecheck]
description = "Type-check TypeScript"
run = "tsc --noEmit"

[tasks.test]
description = "Run tests"
run = "vitest run"

[tasks.build]
description = "Compile the pi extension and core, bundle the CLI, and check the fetch worker sits beside its resolvers"
run = [
    "rm -rf dist",
    "tsc -p tsconfig.build.json",
    "tsdown",
    "scripts/check-dist.sh",
]

[tasks.check]
description = "Run full verification"
depends = ["lint", "typecheck", "test", "build"]

[tasks.release]
description = "Release Unreleased as the given version: changelog, package.json, commit, tag, and push"
usage = 'arg "<version>" help="The version to release, such as 1.2.3"'
run = 'scripts/release.sh "$usage_version"'

[tasks.renovate]
description = "Run Renovate"
run = "MISE_ENV=renovate mise x -- renovate"
